<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chelcy Network - Matataki Rate Ranking</title>
    <style>
        :root {
            --bg-color: #0f1016;
            --card-bg: #1a1c29;
            --accent-color: #00ffcc;
            --accent-hover: #00cca3;
            --text-main: #ffffff;
            --text-sub: #a0a5b8;
            --border-color: #2a2e43;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
            font-size: 1.8rem;
            text-shadow: 0 0 10px rgba(0,255,204,0.3);
        }
        header p {
            color: var(--text-sub);
            font-size: 0.9rem;
        }
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-sub);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .tab-btn.active {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        .course-selector-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        select {
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 1rem;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .badge-tight { background-color: #ff4757; color: white; }
        .badge-competitive { background-color: #ffa502; color: white; }
        .badge-open { background-color: #2ed573; color: white; }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }
        th {
            color: var(--text-sub);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        tr.player-row:hover td {
            background-color: rgba(255,255,255,0.03);
            cursor: pointer;
        }
        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .mc-avatar {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            background-color: #111;
        }
        .rank-1 { color: #ffd700; font-weight: bold; }
        .rank-2 { color: #c0c0c0; font-weight: bold; }
        .rank-3 { color: #cd7f32; font-weight: bold; }

        #loading-msg {
            text-align: center;
            color: var(--accent-color);
            padding: 20px;
            font-weight: bold;
        }

        /* モーダル */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            padding: 25px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 1.5rem;
            color: var(--text-sub);
            cursor: pointer;
        }
        .close-btn:hover { color: var(--text-main); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Chelcy Network : Matataki Rate</h1>
        <p>Minecraft Java Athletic - 瞬（matataki） Rate Ranking System</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('ranking')">総合レートランキング</button>
        <button class="tab-btn" onclick="switchTab('courses')">コース別TOP10</button>
    </div>

    <div id="loading-msg">スプレッドシートからデータを読み込み中...</div>

    <!-- 総合ランキング画面 -->
    <div id="ranking" class="section active" style="display:none;">
        <div class="card">
            <h2>総合レートランキング</h2>
            <p style="color: var(--text-sub); font-size: 0.85rem; margin-bottom: 15px;">プレイヤー名をクリックすると詳細データが表示されます</p>
            <table>
                <thead>
                    <tr>
                        <th>順位</th>
                        <th>プレイヤー名</th>
                        <th>総合レート</th>
                    </tr>
                </thead>
                <tbody id="ranking-tbody"></tbody>
            </table>
        </div>
    </div>

    <!-- コース別TOP10画面 -->
    <div id="courses" class="section">
        <div class="card">
            <div class="course-selector-bar">
                <div>
                    <label for="course-select">コース選択：</label>
                    <select id="course-select" onchange="renderCourseData()"></select>
                </div>
                <div id="difficulty-badge-container"></div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>順位</th>
                        <th>プレイヤー名</th>
                        <th>タイム</th>
                        <th>獲得ポイント</th>
                    </tr>
                </thead>
                <tbody id="course-tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- プレイヤー詳細モーダル -->
<div id="player-modal" class="modal" onclick="closeModalDirect()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeModalDirect()">&times;</span>
        <div id="modal-body"></div>
    </div>
</div>

<script>
    // ==========================================
    // ★ ここにスプレッドシートの公開CSV URLを貼り付ける ★
    // ==========================================
    const RECORDS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSZcUp7yh9oCsq6_lZNC9W5TiFiXax31s8rAfWVEAjZeg_fPHNwB3Q8Y2RYqlnqmX0R8kKnv2TLSNXV/pub?gid=0&single=true&output=csv" ;
    const POINTS_CSV_URL  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSZcUp7yh9oCsq6_lZNC9W5TiFiXax31s8rAfWVEAjZeg_fPHNwB3Q8Y2RYqlnqmX0R8kKnv2TLSNXV/pub?gid=1265643872&single=true&output=csv" ;

    let pointsMap = {};
    let recordsData = [];

    // CSV文字列を配列データに変換する関数
    function parseCSV(csvText) {
        const lines = csvText.trim().split(/\r?\n/);
        const headers = lines[0].split(',').map(h => h.trim());
        const result = [];
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const values = lines[i].split(',').map(v => v.trim());
            const obj = {};
            headers.forEach((h, idx) => {
                obj[h] = values[idx];
            });
            result.push(obj);
        }
        return result;
    }

    // スプレッドシートからデータを取得して初期化
    async function initApp() {
        try {
            const [recRes, ptsRes] = await Promise.all([
                fetch(RECORDS_CSV_URL),
                fetch(POINTS_CSV_URL)
            ]);

            const recText = await recRes.text();
            const ptsText = await ptsRes.text();

            // Pointsの変換
            const rawPoints = parseCSV(ptsText);
            rawPoints.forEach(row => {
                const r = parseInt(row.rank, 10);
                const p = parseFloat(row.point);
                if (!isNaN(r) && !isNaN(p)) {
                    pointsMap[r] = p;
                }
            });

            // Recordsの変換
            const rawRecords = parseCSV(recText);
            recordsData = rawRecords.map(row => ({
                course: row.course,
                rank: parseInt(row.rank, 10),
                player: row.player,
                time: parseFloat(row.time)
            })).filter(r => r.course && !isNaN(r.rank) && r.player && !isNaN(r.time));

            // コースのプルダウンを自動生成
            populateCourseSelect();

            // 画面描画
            document.getElementById('loading-msg').style.display = 'none';
            document.getElementById('ranking').style.display = 'block';
            renderOverallRanking();
            renderCourseData();

        } catch (err) {
            document.getElementById('loading-msg').innerHTML = 
                `<span style="color:#ff4757;">データの読み込みに失敗しました。CSVのURLが正しく貼られているか確認してください。</span>`;
            console.error(err);
        }
    }

    // コース選択肢をデータから自動作成
    function populateCourseSelect() {
        const select = document.getElementById('course-select');
        const courses = [...new Set(recordsData.map(r => r.course))];
        select.innerHTML = '';
        courses.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c;
            opt.textContent = c;
            select.appendChild(opt);
        });
    }

    function switchTab(tabId) {
        document.querySelectorAll('.section').forEach(el => {
            el.classList.remove('active');
            el.style.display = 'none';
        });
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        const target = document.getElementById(tabId);
        target.classList.add('active');
        target.style.display = 'block';
        event.currentTarget.classList.add('active');
    }

    function renderOverallRanking() {
        const playerScores = {};
        recordsData.forEach(rec => {
            const pts = pointsMap[rec.rank] || 0;
            if (!playerScores[rec.player]) playerScores[rec.player] = 0;
            playerScores[rec.player] += pts;
        });

        const sortedPlayers = Object.entries(playerScores).sort((a, b) => b[1] - a[1]);
        const tbody = document.getElementById('ranking-tbody');
        tbody.innerHTML = '';

        sortedPlayers.forEach(([player, score], index) => {
            const rank = index + 1;
            const rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';
            const avatarUrl = `https://mc-heads.net/avatar/${player}/28`;

            tbody.innerHTML += `
                <tr class="player-row" onclick="openPlayerModal('${player}')">
                    <td class="${rankClass}">${rank}位</td>
                    <td>
                        <div class="player-info">
                            <img src="${avatarUrl}" class="mc-avatar" alt="${player}">
                            <strong>${player}</strong>
                        </div>
                    </td>
                    <td>${score} pt</td>
                </tr>
            `;
        });
    }

    function renderCourseData() {
        const selectedCourse = document.getElementById('course-select').value;
        const filtered = recordsData.filter(rec => rec.course === selectedCourse)
                                   .sort((a, b) => a.rank - b.rank);

        const tbody = document.getElementById('course-tbody');
        const badgeContainer = document.getElementById('difficulty-badge-container');
        tbody.innerHTML = '';
        badgeContainer.innerHTML = '';

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-sub);">データがありません</td></tr>`;
            badgeContainer.innerHTML = `<span class="badge badge-open">NO DATA</span>`;
            return;
        }

        const t1 = filtered[0].time;
        const tLast = filtered[filtered.length - 1].time;
        const diffRatio = ((tLast - t1) / t1) * 100;

        let badgeHtml = '';
        if (diffRatio < 10) {
            badgeHtml = `<span class="badge badge-tight">🔥 ULTRA TIGHT (${diffRatio.toFixed(1)}%差)</span>`;
        } else if (diffRatio < 25) {
            badgeHtml = `<span class="badge badge-competitive">⚔️ COMPETITIVE (${diffRatio.toFixed(1)}%差)</span>`;
        } else {
            badgeHtml = `<span class="badge badge-open">🌱 WIDE OPEN (${diffRatio.toFixed(1)}%差)</span>`;
        }
        badgeContainer.innerHTML = badgeHtml;

        filtered.forEach(rec => {
            const pts = pointsMap[rec.rank] || 0;
            const rankClass = rec.rank === 1 ? 'rank-1' : rec.rank === 2 ? 'rank-2' : rec.rank === 3 ? 'rank-3' : '';
            const avatarUrl = `https://mc-heads.net/avatar/${rec.player}/28`;

            tbody.innerHTML += `
                <tr>
                    <td class="${rankClass}">${rec.rank}位</td>
                    <td>
                        <div class="player-info">
                            <img src="${avatarUrl}" class="mc-avatar" alt="${rec.player}">
                            <span>${rec.player}</span>
                        </div>
                    </td>
                    <td>${rec.time.toFixed(3)}秒</td>
                    <td>+${pts} pt</td>
                </tr>
            `;
        });
    }

    function openPlayerModal(playerName) {
        const playerRecords = recordsData.filter(rec => rec.player === playerName);
        let totalPts = 0;
        let recordsHtml = '';

        playerRecords.forEach(rec => {
            const pts = pointsMap[rec.rank] || 0;
            totalPts += pts;
            recordsHtml += `<li><strong>${rec.course}</strong> : ${rec.rank}位 (${rec.time.toFixed(3)}秒) → +${pts}pt</li>`;
        });

        const modalBody = document.getElementById('modal-body');
        modalBody.innerHTML = `
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
                <img src="https://mc-heads.net/avatar/${playerName}/64" style="width: 54px; height: 54px; border-radius: 8px; background:#111;" alt="${playerName}">
                <div>
                    <h2 style="margin: 0; color: var(--accent-color);">${playerName}</h2>
                    <p style="margin: 5px 0 0 0; color: var(--text-sub);">総合レート: <strong>${totalPts} pt</strong></p>
                </div>
            </div>
            <h3 style="font-size: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 5px;">記録一覧</h3>
            <ul style="padding-left: 20px; line-height: 1.8; max-height: 200px; overflow-y: auto;">
                ${recordsHtml || '<li style="color:var(--text-sub);">記録がありません</li>'}
            </ul>
        `;

        document.getElementById('player-modal').style.display = 'flex';
    }

    function closeModalDirect() {
        document.getElementById('player-modal').style.display = 'none';
    }

    // 起動
    initApp();
</script>

</body>
</html>
