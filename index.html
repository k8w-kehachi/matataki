<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chelcy Network - Matataki Point Ranking</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #151722;
            --card-hover: #1e2130;
            --accent-color: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.25);
            --text-main: #ffffff;
            --text-sub: #9499b0;
            --border-color: #262a3d;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #161b2e 0%, #0b0c10 70%);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            scroll-behavior: smooth;
        }
        .container {
            max-width: 1050px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 10px;
        }
        header h1 {
            color: var(--accent-color);
            margin: 0 0 6px 0;
            font-size: 2rem;
            letter-spacing: 0.04em;
            text-shadow: 0 0 15px var(--accent-glow);
        }
        header p {
            color: var(--text-sub);
            font-size: 0.9rem;
            margin: 0;
        }
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-sub);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .tab-btn:hover {
            border-color: var(--accent-color);
            color: var(--text-main);
        }
        .tab-btn.active {
            background-color: var(--accent-color);
            color: #090a0f;
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.35);
            margin-bottom: 24px;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }

        /* フィルターバー */
        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }
        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background-color: var(--bg-color);
            color: var(--text-sub);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .filter-btn:hover {
            border-color: var(--text-sub);
            color: var(--text-main);
        }
        .filter-btn.active {
            background-color: rgba(0, 255, 204, 0.15);
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* コースグリッドカード */
        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
            margin-bottom: 10px;
        }
        .course-tile {
            background-color: #10121b;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
        }
        .course-tile:hover {
            transform: translateY(-2px);
            background-color: var(--card-hover);
            border-color: #3f4666;
        }
        .course-tile.selected {
            border-color: var(--accent-color);
            background-color: rgba(0, 255, 204, 0.06);
            box-shadow: 0 0 12px var(--accent-glow);
        }
        .tile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }
        .tile-title {
            font-weight: bold;
            font-size: 1.05rem;
            color: var(--text-main);
        }
        .tile-wr {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(255,255,255,0.03);
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .tile-wr-player {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-main);
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tile-wr-time {
            color: var(--accent-color);
            font-weight: bold;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .tile-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        /* 難易度バッジ */
        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            white-space: nowrap;
        }
        .badge-ultratight { background-color: rgba(255, 45, 85, 0.2); color: #ff3b30; border: 1px solid #ff3b30; }
        .badge-tight { background-color: rgba(255, 149, 0, 0.2); color: #ff9500; border: 1px solid #ff9500; }
        .badge-competitive { background-color: rgba(88, 86, 214, 0.2); color: #5856d6; border: 1px solid #5856d6; }
        .badge-open { background-color: rgba(46, 213, 115, 0.2); color: #7bed9f; border: 1px solid #2ed573; }
        
        .wr-badge {
            background-color: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.4);
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        /* プロフィール用バッジ群 */
        .profile-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }
        .p-badge {
            font-size: 0.7rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.05);
        }
        .p-badge-ut-top1 { background: rgba(255, 45, 85, 0.2); color: #ff3b30; border-color: #ff3b30; }
        .p-badge-ut-top10 { background: rgba(255, 149, 0, 0.2); color: #ff9500; border-color: #ff9500; }
        .p-badge-top1 { background: rgba(255, 215, 0, 0.2); color: #ffd700; border-color: #ffd700; }
        .p-badge-overall { background: rgba(0, 255, 204, 0.15); color: var(--accent-color); border-color: var(--accent-color); }

        /* コース詳細ヘッダー */
        .course-detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 10px;
        }
        .course-detail-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .course-detail-title h2 {
            margin: 0;
            font-size: 1.4rem;
            color: var(--accent-color);
        }

        /* テーブル */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 13px 15px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }
        th {
            color: var(--text-sub);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        tr.player-row:hover td {
            background-color: rgba(255,255,255,0.04);
            cursor: pointer;
        }

        /* 1〜3位の特別強調行 */
        tr.podium-1 td {
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.12) 0%, rgba(21, 23, 34, 0) 70%);
            border-bottom: 1px solid rgba(255, 215, 0, 0.25);
        }
        tr.podium-2 td {
            background: linear-gradient(90deg, rgba(192, 192, 192, 0.1) 0%, rgba(21, 23, 34, 0) 70%);
            border-bottom: 1px solid rgba(192, 192, 192, 0.2);
        }
        tr.podium-3 td {
            background: linear-gradient(90deg, rgba(205, 127, 50, 0.1) 0%, rgba(21, 23, 34, 0) 70%);
            border-bottom: 1px solid rgba(205, 127, 50, 0.2);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .mc-avatar {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            background-color: #111;
        }
        .mc-avatar-sm {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            background-color: #111;
        }
        
        .rank-badge-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .rank-1 { background-color: rgba(255, 215, 0, 0.2); color: #ffd700; border: 1px solid #ffd700; }
        .rank-2 { background-color: rgba(192, 192, 192, 0.2); color: #c0c0c0; border: 1px solid #c0c0c0; }
        .rank-3 { background-color: rgba(205, 127, 50, 0.2); color: #cd7f32; border: 1px solid #cd7f32; }
        .rank-other { color: var(--text-sub); padding-left: 6px; }

        #loading-msg {
            text-align: center;
            color: var(--accent-color);
            padding: 30px;
            font-weight: bold;
        }

        /* モーダル */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.75);
            backdrop-filter: blur(3px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            padding: 25px;
            position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 1.5rem;
            color: var(--text-sub);
            cursor: pointer;
        }
        .close-btn:hover { color: var(--text-main); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Chelcy Network : Matataki Point</h1>
        <p>Minecraft Java Athletic - 瞬（matataki） Point Ranking System</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('ranking', this)">総合ポイントランキング</button>
        <button class="tab-btn" onclick="switchTab('wr-ranking', this)">1位獲得数ランキング</button>
        <button class="tab-btn" onclick="switchTab('courses', this)">コース一覧 & TOP10</button>
    </div>

    <div id="loading-msg">スプレッドシートからデータを読み込み中...</div>

    <!-- 総合ポイントランキング画面 -->
    <div id="ranking" class="section active" style="display:none;">
        <div class="card">
            <h2 style="margin-top:0;">総合ポイントランキング</h2>
            <p style="color: var(--text-sub); font-size: 0.85rem; margin-bottom: 15px;">プレイヤー名をクリックすると詳細データが表示されます</p>
            <table>
                <thead>
                    <tr>
                        <th style="width: 80px;">順位</th>
                        <th>プレイヤー名</th>
                        <th style="width: 130px; text-align:center;">1位獲得数</th>
                        <th style="text-align:right;">総合ポイント</th>
                    </tr>
                </thead>
                <tbody id="ranking-tbody"></tbody>
            </table>
        </div>
    </div>

    <!-- 1位獲得数ランキング画面 -->
    <div id="wr-ranking" class="section" style="display:none;">
        <div class="card">
            <h2 style="margin-top:0;">1位獲得数ランキング</h2>
            <p style="color: var(--text-sub); font-size: 0.85rem; margin-bottom: 15px;">全コースの中で「1位（WR）」を獲得した回数のランキングです</p>
            <table>
                <thead>
                    <tr>
                        <th style="width: 80px;">順位</th>
                        <th>プレイヤー名</th>
                        <th style="text-align:right; padding-right:20px;">1位獲得数</th>
                    </tr>
                </thead>
                <tbody id="wr-ranking-tbody"></tbody>
            </table>
        </div>
    </div>

    <!-- コース一覧 & TOP10画面 -->
    <div id="courses" class="section">
        <div class="card">
            <div class="filter-bar">
                <h2 style="margin:0; font-size:1.15rem;">コース一覧（クリックでTOP10表示）</h2>
                <div class="filter-buttons">
                    <button class="filter-btn active" onclick="setCourseFilter('ALL', this)">ALL</button>
                    <button class="filter-btn" onclick="setCourseFilter('ULTRATIGHT', this)">🔥 ULTRA TIGHT</button>
                    <button class="filter-btn" onclick="setCourseFilter('TIGHT', this)">⚡ TIGHT</button>
                    <button class="filter-btn" onclick="setCourseFilter('COMPETITIVE', this)">⚔️ COMPETITIVE</button>
                    <button class="filter-btn" onclick="setCourseFilter('OPEN', this)">🌱 WIDE OPEN</button>
                </div>
            </div>
            <div id="course-grid" class="course-grid"></div>
        </div>

        <div class="card" id="course-detail-card">
            <div class="course-detail-header">
                <div class="course-detail-title">
                    <h2 id="selected-course-name">コース未選択</h2>
                    <span id="difficulty-badge-container"></span>
                </div>
                <div style="color: var(--text-sub); font-size: 0.85rem;" id="course-diff-info"></div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th style="width: 80px;">順位</th>
                        <th>プレイヤー名</th>
                        <th>タイム</th>
                        <th style="text-align:right;">獲得ポイント</th>
                    </tr>
                </thead>
                <tbody id="course-tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- プレイヤー詳細モーダル -->
<div id="player-modal" class="modal" onclick="closeModalDirect()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeModalDirect()">&times;</span>
        <div id="modal-body"></div>
    </div>
</div>

<script>
    // ==========================================
    // ★ ここにスプレッドシートの公開CSV URLを貼り付ける ★
    // ==========================================
    const RECORDS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSZcUp7yh9oCsq6_lZNC9W5TiFiXax31s8rAfWVEAjZeg_fPHNwB3Q8Y2RYqlnqmX0R8kKnv2TLSNXV/pub?gid=0&single=true&output=csv";
    const POINTS_CSV_URL  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSZcUp7yh9oCsq6_lZNC9W5TiFiXax31s8rAfWVEAjZeg_fPHNwB3Q8Y2RYqlnqmX0R8kKnv2TLSNXV/pub?gid=1265643872&single=true&output=csv";

    let pointsMap = {};
    let recordsData = [];
    let courseMetaList = []; 
    let currentSelectedCourse = "";
    let currentFilter = "ALL";

    function parseCSV(csvText) {
        const lines = csvText.trim().split(/\r?\n/);
        const headers = lines[0].split(',').map(h => h.trim());
        const result = [];
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const values = lines[i].split(',').map(v => v.trim());
            const obj = {};
            headers.forEach((h, idx) => {
                obj[h] = values[idx];
            });
            result.push(obj);
        }
        return result;
    }

    async function initApp() {
        try {
            const [recRes, ptsRes] = await Promise.all([
                fetch(RECORDS_CSV_URL),
                fetch(POINTS_CSV_URL)
            ]);

            const recText = await recRes.text();
            const ptsText = await ptsRes.text();

            const rawPoints = parseCSV(ptsText);
            rawPoints.forEach(row => {
                const r = parseInt(row.rank, 10);
                const p = parseFloat(row.point);
                if (!isNaN(r) && !isNaN(p)) {
                    pointsMap[r] = p;
                }
            });

            const rawRecords = parseCSV(recText);
            recordsData = rawRecords.map(row => {
                const cleanTime = parseFloat(String(row.time).replace(/[^0-9.]/g, ''));
                return {
                    course: row.course ? row.course.trim() : '',
                    rank: parseInt(row.rank, 10),
                    player: row.player ? row.player.trim() : '',
                    time: isNaN(cleanTime) ? 0 : cleanTime
                };
            }).filter(r => r.course && !isNaN(r.rank) && r.player && r.time > 0);

            buildCourseMeta();

            if (courseMetaList.length > 0) {
                currentSelectedCourse = courseMetaList[0].name;
            }

            document.getElementById('loading-msg').style.display = 'none';
            document.getElementById('ranking').style.display = 'block';
            renderOverallRanking();
            renderWrRanking();
            renderCourseGrid();
            renderCourseDetail(currentSelectedCourse);

        } catch (err) {
            document.getElementById('loading-msg').innerHTML = 
                `<span style="color:#ff4757;">データの読み込みに失敗しました。CSVのURLが正しく貼られているか確認してください。</span>`;
            console.error(err);
        }
    }

    function buildCourseMeta() {
        const courseNames = [...new Set(recordsData.map(r => r.course))];
        courseMetaList = courseNames.map(name => {
            const recs = recordsData.filter(r => r.course === name).sort((a, b) => a.rank - b.rank);
            const wrRecord = recs[0];
            const lastRecord = recs[recs.length - 1];
            const diffRatio = ((lastRecord.time - wrRecord.time) / wrRecord.time) * 100;

            let tier = "OPEN";
            let label = "🌱 WIDE OPEN";
            let badgeClass = "badge-open";

            if (diffRatio < 3) {
                tier = "ULTRATIGHT";
                label = "🔥 ULTRA TIGHT";
                badgeClass = "badge-ultratight";
            } else if (diffRatio >= 3 && diffRatio < 10) {
                tier = "TIGHT";
                label = "⚡ TIGHT";
                badgeClass = "badge-tight";
            } else if (diffRatio >= 10 && diffRatio < 15) {
                tier = "COMPETITIVE";
                label = "⚔️ COMPETITIVE";
                badgeClass = "badge-competitive";
            }

            return {
                name: name,
                records: recs,
                wrPlayer: wrRecord.player,
                wrTime: wrRecord.time,
                count: recs.length,
                diffRatio: diffRatio,
                tier: tier,
                label: label,
                badgeClass: badgeClass
            };
        });
    }

    function switchTab(tabId, btnEl) {
        document.querySelectorAll('.section').forEach(el => {
            el.classList.remove('active');
            el.style.display = 'none';
        });
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        const target = document.getElementById(tabId);
        target.classList.add('active');
        target.style.display = 'block';
        btnEl.classList.add('active');
    }

    // プレイヤーごとの集計・同率対応付きランキング計算
    function getPlayerStats() {
        const playerScores = {};
        const playerWrCounts = {};

        recordsData.forEach(rec => {
            const pts = pointsMap[rec.rank] || 0;
            if (!playerScores[rec.player]) playerScores[rec.player] = 0;
            playerScores[rec.player] += pts;

            if (rec.rank === 1) {
                if (!playerWrCounts[rec.player]) playerWrCounts[rec.player] = 0;
                playerWrCounts[rec.player] += 1;
            }
        });

        // ポイント順にソート
        const sortedArray = Object.entries(playerScores).sort((a, b) => b[1] - a[1]);
        
        // 正確な同率順位の計算（ゴルフ方式：同スコアなら同じ順位）
        const rankedPlayers = [];
        let currentRank = 1;
        for (let i = 0; i < sortedArray.length; i++) {
            if (i > 0 && sortedArray[i][1] < sortedArray[i - 1][1]) {
                currentRank = i + 1;
            }
            rankedPlayers.push({
                player: sortedArray[i][0],
                score: sortedArray[i][1],
                rank: currentRank
            });
        }

        return { rankedPlayers, playerWrCounts };
    }

    function renderOverallRanking() {
        const { rankedPlayers, playerWrCounts } = getPlayerStats();
        const tbody = document.getElementById('ranking-tbody');
        tbody.innerHTML = '';

        rankedPlayers.forEach(item => {
            const rank = item.rank;
            const player = item.player;
            const score = item.score;

            let rowClass = '';
            let badgeClass = 'rank-other';
            let rankDisplay = `${rank}`;

            if (rank === 1) {
                rowClass = 'podium-1'; badgeClass = 'rank-1'; rankDisplay = '👑 1';
            } else if (rank === 2) {
                rowClass = 'podium-2'; badgeClass = 'rank-2'; rankDisplay = '🥈 2';
            } else if (rank === 3) {
                rowClass = 'podium-3'; badgeClass = 'rank-3'; rankDisplay = '🥉 3';
            }

            const avatarUrl = `https://mc-heads.net/avatar/${player}/30`;
            const wrCount = playerWrCounts[player] || 0;
            const wrBadgeHtml = wrCount > 0 ? `<span class="wr-badge">👑 ${wrCount}回</span>` : `<span style="color:var(--text-sub); font-size:0.8rem;">-</span>`;

            tbody.innerHTML += `
                <tr class="player-row ${rowClass}" onclick="openPlayerModal('${player}')">
                    <td><span class="rank-badge-box ${badgeClass}">${rankDisplay}</span></td>
                    <td>
                        <div class="player-info">
                            <img src="${avatarUrl}" class="mc-avatar" alt="${player}">
                            <strong>${player}</strong>
                        </div>
                    </td>
                    <td style="text-align:center;">${wrBadgeHtml}</td>
                    <td style="text-align:right; font-weight:bold; color:var(--accent-color);">${score.toLocaleString()} pt</td>
                </tr>
            `;
        });
    }

    function renderWrRanking() {
        const { playerWrCounts } = getPlayerStats();
        const sortedWr = Object.entries(playerWrCounts).sort((a, b) => b[1] - a[1]);
        const tbody = document.getElementById('wr-ranking-tbody');
        tbody.innerHTML = '';

        if (sortedWr.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-sub);">1位のデータがまだありません</td></tr>`;
            return;
        }

        // 1位獲得数の同率順位計算
        let currentRank = 1;
        sortedWr.forEach(([player, count], index) => {
            if (index > 0 && count < sortedWr[index - 1][1]) {
                currentRank = index + 1;
            }

            let rowClass = '';
            let badgeClass = 'rank-other';
            let rankDisplay = `${currentRank}`;

            if (currentRank === 1) {
                rowClass = 'podium-1'; badgeClass = 'rank-1'; rankDisplay = '👑 1';
            } else if (currentRank === 2) {
                rowClass = 'podium-2'; badgeClass = 'rank-2'; rankDisplay = '🥈 2';
            } else if (currentRank === 3) {
                rowClass = 'podium-3'; badgeClass = 'rank-3'; rankDisplay = '🥉 3';
            }

            const avatarUrl = `https://mc-heads.net/avatar/${player}/30`;

            tbody.innerHTML += `
                <tr class="player-row ${rowClass}" onclick="openPlayerModal('${player}')">
                    <td><span class="rank-badge-box ${badgeClass}">${rankDisplay}</span></td>
                    <td>
                        <div class="player-info">
                            <img src="${avatarUrl}" class="mc-avatar" alt="${player}">
                            <strong>${player}</strong>
                        </div>
                    </td>
                    <td style="text-align:right; padding-right:20px; font-weight:bold; color:#ffd700; font-size:1.05rem;">👑 ${count} 回</td>
                </tr>
            `;
        });
    }

    function setCourseFilter(filterType, btnEl) {
        currentFilter = filterType;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btnEl.classList.add('active');
        renderCourseGrid();
    }

    function renderCourseGrid() {
        const grid = document.getElementById('course-grid');
        grid.innerHTML = '';

        const filteredMeta = currentFilter === 'ALL' 
            ? courseMetaList 
            : courseMetaList.filter(c => c.tier === currentFilter);

        if (filteredMeta.length === 0) {
            grid.innerHTML = `<p style="color:var(--text-sub); grid-column: 1 / -1;">該当するコースがありません</p>`;
            return;
        }

        filteredMeta.forEach(meta => {
            const isSelected = meta.name === currentSelectedCourse ? 'selected' : '';
            const avatarUrl = `https://mc-heads.net/avatar/${meta.wrPlayer}/20`;

            grid.innerHTML += `
                <div class="course-tile ${isSelected}" onclick="selectCourseAndScroll('${meta.name}')">
                    <div class="tile-header">
                        <span class="tile-title">${meta.name}</span>
                        <span class="badge ${meta.badgeClass}">${meta.tier}</span>
                    </div>
                    <div class="tile-wr">
                        <div class="tile-wr-player">
                            <span style="color:#ffd700; font-size:0.75rem;">👑</span>
                            <img src="${avatarUrl}" class="mc-avatar-sm" alt="${meta.wrPlayer}">
                            <span>${meta.wrPlayer}</span>
                        </div>
                        <span class="tile-wr-time">${meta.wrTime.toFixed(3)}s</span>
                    </div>
                    <div class="tile-footer">
                        <span>TOP10枠: ${meta.count}/10</span>
                        <span>タイム差: ${meta.diffRatio.toFixed(1)}%</span>
                    </div>
                </div>
            `;
        });
    }

    // コース選択 ＆ 自動スクロール
    function selectCourseAndScroll(courseName) {
        currentSelectedCourse = courseName;
        renderCourseGrid();
        renderCourseDetail(courseName);

        // 詳細テーブルの位置へスムーズにスクロール
        const detailCard = document.getElementById('course-detail-card');
        detailCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function renderCourseDetail(courseName) {
        const meta = courseMetaList.find(c => c.name === courseName);
        const titleEl = document.getElementById('selected-course-name');
        const badgeContainer = document.getElementById('difficulty-badge-container');
        const diffInfoEl = document.getElementById('course-diff-info');
        const tbody = document.getElementById('course-tbody');

        tbody.innerHTML = '';

        if (!meta) {
            titleEl.textContent = "コースデータなし";
            badgeContainer.innerHTML = "";
            diffInfoEl.textContent = "";
            return;
        }

        titleEl.textContent = meta.name;
        badgeContainer.innerHTML = `<span class="badge ${meta.badgeClass}">${meta.label}</span>`;
        diffInfoEl.textContent = `1位と最下位のタイム差: ${meta.diffRatio.toFixed(1)}%`;

        meta.records.forEach(rec => {
            const pts = pointsMap[rec.rank] || 0;
            let rowClass = '';
            let badgeClass = 'rank-other';
            let rankDisplay = `${rec.rank}位`;

            if (rec.rank === 1) {
                rowClass = 'podium-1'; badgeClass = 'rank-1'; rankDisplay = '👑 1位';
            } else if (rec.rank === 2) {
                rowClass = 'podium-2'; badgeClass = 'rank-2'; rankDisplay = '🥈 2位';
            } else if (rec.rank === 3) {
                rowClass = 'podium-3'; badgeClass = 'rank-3'; rankDisplay = '🥉 3位';
            }

            const avatarUrl = `https://mc-heads.net/avatar/${rec.player}/30`;

            tbody.innerHTML += `
                <tr class="player-row ${rowClass}" onclick="openPlayerModal('${rec.player}')">
                    <td><span class="rank-badge-box ${badgeClass}">${rankDisplay}</span></td>
                    <td>
                        <div class="player-info">
                            <img src="${avatarUrl}" class="mc-avatar" alt="${rec.player}">
                            <span>${rec.player}</span>
                        </div>
                    </td>
                    <td style="font-family:monospace; font-size:0.95rem;">${rec.time.toFixed(3)}秒</td>
                    <td style="text-align:right; font-weight:bold;">+${pts} pt</td>
                </tr>
            `;
        });
    }

function openPlayerModal(playerName) {
        const playerRecords = recordsData.filter(rec => rec.player === playerName);
        let totalPts = 0;
        let recordsHtml = '';

        // プレイヤーのプロフィールバッジ条件判定用
        let hasAnyWr = false;

        playerRecords.forEach(rec => {
            const pts = pointsMap[rec.rank] || 0;
            totalPts += pts;

            if (rec.rank === 1) hasAnyWr = true;

            const crown = rec.rank === 1 ? '👑 ' : '';
            recordsHtml += `<li><strong>${crown}${rec.course}</strong> : ${rec.rank}位 (${rec.time.toFixed(3)}秒) → +${pts}pt</li>`;
        });

        // 総合順位・条件バッジの判定
        const { rankedPlayers } = getPlayerStats();
        const foundPlayerRank = rankedPlayers.find(p => p.player === playerName);
        let overallBadgeHtml = '';

        if (foundPlayerRank) {
            const r = foundPlayerRank.rank;
            if (r >= 1 && r <= 3) {
                overallBadgeHtml = `<span class="p-badge p-badge-overall">総合TOP${r}</span>`;
            } else if (r >= 4 && r <= 5) {
                overallBadgeHtml = `<span class="p-badge p-badge-overall">総合TOP5</span>`;
            } else if (r >= 6 && r <= 10) {
                overallBadgeHtml = `<span class="p-badge p-badge-overall">総合TOP10</span>`;
            }
        }

        // 追加バッジのHTML組み立て（Ultra Tight関連を削除、1000pt以上のマスタバッジを追加）
        let badgesHtml = '';
        if (hasAnyWr) badgesHtml += `<span class="p-badge p-badge-top1">👑 TOP1</span>`;
        if (totalPts >= 1000) badgesHtml += `<span class="p-badge p-badge-ut-top1" style="background: rgba(186, 85, 211, 0.2); color: #da70d6; border-color: #da70d6;">✨ matataki Master</span>`;
        badgesHtml += overallBadgeHtml;

        const modalBody = document.getElementById('modal-body');
        modalBody.innerHTML = `
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 15px;">
                <img src="https://mc-heads.net/avatar/${playerName}/64" style="width: 54px; height: 54px; border-radius: 8px; background:#111;" alt="${playerName}">
                <div>
                    <h2 style="margin: 0; color: var(--accent-color);">${playerName}</h2>
                    <p style="margin: 5px 0 0 0; color: var(--text-sub);">総合ポイント: <strong>${totalPts.toLocaleString()} pt</strong></p>
                </div>
            </div>
            <div class="profile-badges" style="margin-bottom: 18px;">
                ${badgesHtml || '<span style="color:var(--text-sub); font-size:0.8rem;">獲得バッジはありません</span>'}
            </div>
            <h3 style="font-size: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 5px;">記録一覧</h3>
            <ul style="padding-left: 20px; line-height: 1.8; max-height: 180px; overflow-y: auto;">
                ${recordsHtml || '<li style="color:var(--text-sub);">記録がありません</li>'}
            </ul>
        `;

        document.getElementById('player-modal').style.display = 'flex';
    }

    initApp();
</script>

</body>
</html>
